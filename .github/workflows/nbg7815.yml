name: Build OpenWrt Firmware for Zyxel NBG7815

on:
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write   # lets you delete stale caches later if you want to

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk gettext \
            git libncurses5-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev \
            file wget swig java-propose-classpath zip
          sudo timedatectl set-timezone UTC

      - name: Update and install feeds
        run: |
          cp feeds.conf.default feeds.conf
          echo "src-git nss https://github.com/JuliusBairaktaris/nss-packages.git;edma-nss" >> feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Pull Requests
        run: |
          ## ksmbd-tools: update to version 3.5.7 - #30312
          #curl -sL https://github.com/openwrt/packages/commit/762eb13068fa98b736b06ece73a940e7f738e9af.patch -o /tmp/30312.patch
          #git -C feeds/packages apply --3way /tmp/30312.patch

      - name: Load build configuration
        run: |
          cp seeds/nbg7815.config .config
          sed -i 's/^# CONFIG_ALL_KMODS=y$/CONFIG_ALL_KMODS=y/' .config # Compile all kernel modules
          # ccache for the world build (kernel, NSS modules, packages)
          grep -q '^CONFIG_CCACHE=y' .config || echo 'CONFIG_CCACHE=y' >> .config
          make defconfig

      - name: Generate release tag
        run: |
          BRANCH="$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9._-' '-')"
          echo "RELEASE_TAG=${BRANCH}-$(date +'%Y.%m.%d-%H%M')" >> "$GITHUB_ENV"

      - name: Configure custom distfeed via uci-defaults
        run: |
          mkdir -p files/etc/uci-defaults
          cat << 'EOF' > "files/etc/uci-defaults/99-custom-distfeed-${{ env.RELEASE_TAG }}"
          #!/bin/sh
          # Replace any previous release's custom feed with the current one
          FEED_URL="https://${{ github.event.repository.owner.login }}.github.io/${{ github.event.repository.name }}/${{ env.RELEASE_TAG }}/packages.adb"
          sed -i '\|^https://${{ github.event.repository.owner.login }}.github.io/${{ github.event.repository.name }}/|d' /etc/apk/repositories.d/distfeeds.list
          [ -s /etc/apk/repositories.d/distfeeds.list ] && [ -n "$(tail -c1 /etc/apk/repositories.d/distfeeds.list)" ] && echo >> /etc/apk/repositories.d/distfeeds.list
          echo "$FEED_URL" >> /etc/apk/repositories.d/distfeeds.list

          exit 0
          EOF
          chmod +x "files/etc/uci-defaults/99-custom-distfeed-${{ env.RELEASE_TAG }}"

      # ---------------------------------------------------------------
      # Cache keys
      # ---------------------------------------------------------------
      - name: Compute cache keys
        id: keys
        run: |
          # Only the options that actually affect host tools + toolchain.
          # CONFIG_ALL_KMODS and package selections are deliberately excluded.
          grep -E '^CONFIG_(TARGET_|GCC_|BINUTILS_|LIBC|USE_|EXTERNAL_TOOLCHAIN|KERNEL_GIT)' .config | sort | tee /tmp/tc-config.txt
          echo "tc_cfg=$(sha256sum /tmp/tc-config.txt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          # dl cache is refreshed at most once per ISO week
          echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------
      # dl/ (source tarballs)
      # ---------------------------------------------------------------
      - name: Restore downloaded sources
        id: dl-cache
        uses: actions/cache/restore@v4
        with:
          path: dl
          key: dl-${{ steps.keys.outputs.week }}
          restore-keys: |
            dl-

      - name: Download package sources
        run: |
          make download -j$(nproc)

      - name: Save downloaded sources
        if: always() && steps.dl-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: dl
          key: ${{ steps.dl-cache.outputs.cache-primary-key }}

      # ---------------------------------------------------------------
      # Host tools + toolchain
      # ---------------------------------------------------------------
      - name: Restore host tools and toolchain
        id: tc-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build_dir/host
            staging_dir/host
            build_dir/toolchain-*
            staging_dir/toolchain-*
          key: host-toolchain-${{ runner.os }}-${{ steps.keys.outputs.tc_cfg }}-${{ hashFiles('rules.mk', 'include/**', 'tools/**', 'toolchain/**') }}
          restore-keys: |
            host-toolchain-${{ runner.os }}-${{ steps.keys.outputs.tc_cfg }}-
            host-toolchain-${{ runner.os }}-

      - name: Build host tools and toolchain
        if: steps.tc-cache.outputs.cache-hit != 'true'
        run: |
          make -j$(nproc) tools/install
          make -j$(nproc) toolchain/install

      # Saved right after the build so a later compile/deploy failure can't lose it
      - name: Save host tools and toolchain
        if: steps.tc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build_dir/host
            staging_dir/host
            build_dir/toolchain-*
            staging_dir/toolchain-*
          key: ${{ steps.tc-cache.outputs.cache-primary-key }}

      # ---------------------------------------------------------------
      # ccache
      # ---------------------------------------------------------------
      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Configure ccache
        run: |
          mkdir -p .ccache
          if [ -x staging_dir/host/bin/ccache ]; then
            staging_dir/host/bin/ccache --max-size=2G || true
          fi

      # ---------------------------------------------------------------
      # World build
      # ---------------------------------------------------------------
      - name: Compile OpenWrt
        id: compile
        run: |
          set -o pipefail
          make -j$(nproc) -k IGNORE_ERRORS="n m" world

      # Persist ccache even if the compile failed, so the next run resumes faster
      - name: Save ccache
        if: always() && steps.compile.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.run_id }}

      - name: Show ccache stats
        if: always() && steps.compile.outcome != 'skipped'
        run: |
          if [ -x staging_dir/host/bin/ccache ]; then
            staging_dir/host/bin/ccache -s || true
          fi
          du -sh .ccache dl build_dir staging_dir 2>/dev/null || true

      - name: Retry failed OpenWRT compile with verbose output
        if: failure() && steps.compile.outcome == 'failure'
        run: |
          set -o pipefail
          make -j1 -k IGNORE_ERRORS="n m" world V=s 2>&1 | tee verbose-build.log

      - name: Upload verbose build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verbose-build-log-${{ env.RELEASE_TAG }}
          path: |
            verbose-build.log
          retention-days: 14

      # ---------------------------------------------------------------
      # Publish
      # ---------------------------------------------------------------
      - name: Prepare GitHub Pages site directory
        run: |
          mkdir -p site_deploy
          cp -r bin/targets/qualcommax/ipq807x/packages/* site_deploy/

      - name: Deploy Everything to Versioned GitHub Pages Subdirectory
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site_deploy
          destination_dir: ${{ env.RELEASE_TAG }}
          keep_files: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            bin/targets/qualcommax/ipq807x/openwrt-qualcommax-ipq807x-zyxel_nbg7815-squashfs-sysupgrade.bin
            bin/targets/qualcommax/ipq807x/config.buildinfo
            bin/targets/qualcommax/ipq807x/sha256sums
            bin/targets/qualcommax/ipq807x/version.buildinfo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
